name: Pakk ut Rettfort

on:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Pakk ut Rettfort
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "Fant ingen zip-fil i roten."
            exit 1
          fi

          rm -rf /tmp/rettfort-upload
          mkdir -p /tmp/rettfort-upload
          unzip -q "$ZIP" -d /tmp/rettfort-upload

          if [ -d /tmp/rettfort-upload/deploy ]; then
            cp -a /tmp/rettfort-upload/deploy/. .
          else
            cp -a /tmp/rettfort-upload/. .
          fi

          rm -f "$ZIP"

      - name: Lagre utpakkede filer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Ingen endringer å lagre."
            exit 0
          fi
          git commit -m "Pakk ut Rettført-applikasjonen"
          git push
