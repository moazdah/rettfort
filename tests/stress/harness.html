<!DOCTYPE html>
<meta charset="utf-8">
<title>Rettført stresstest</title>
<script type="module">
  import * as E from '../../rettfort-engine.js';
  window.E = E;
  // Kjører motoren slik appen gjør. Byte-input dekodes som File.text() (UTF-8).
  window.runCase = input => {
    // Filer leses slik appen gjør det: E.decodeFile() på rå bytes.
    const dec = (b64, kind) => b64 == null ? undefined : E.decodeFile(Uint8Array.from(atob(b64), c => c.charCodeAt(0)), kind);
    let x;
    try { x = { saft: input.saft ?? dec(input.saftB64, 'xml'), prev: input.prev ?? dec(input.prevB64, 'csv'), curr: input.curr ?? dec(input.currB64, 'csv'), settings: input.settings, bank: input.bank, docs: input.docs }; }
    catch (e) { return { ok: false, ms: 0, error: String(e.message) }; }
    if (input.grounded) return { ok: true, ms: 0, r: { grounded: E.numbersGrounded(input.grounded[0], input.grounded[1]), findings: [], controls: [] } };
    const t0 = performance.now();
    try {
      const r = E.analyze(x);
      const out = JSON.parse(JSON.stringify(r));
      out.prompts = r.findings.map(f => E.aiFindingPrompt(f));
      return { ok: true, ms: performance.now() - t0, r: out };
    } catch (e) {
      return { ok: false, ms: performance.now() - t0, error: String(e && e.message || e), stack: String(e && e.stack || '').split('\n').slice(0, 3).join(' | ') };
    }
  };
  window.ready = true;
</script>
